<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar Robot Controller</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111827;color:#fff}
#viewer{position:absolute;inset:0}
#ui{position:absolute;top:20px;left:20px;width:290px;padding:20px;border-radius:16px;background:rgba(15,23,42,.94);z-index:5;box-shadow:0 12px 35px rgba(0,0,0,.3)}
h1{margin:0 0 4px;font-size:21px}.sub{color:#94a3b8;font-size:13px;margin-bottom:16px}
.status{padding:9px;background:#1e293b;border-radius:8px;margin-bottom:14px;font-size:13px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
button{border:0;border-radius:8px;padding:13px;background:#334155;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#475569}.f{grid-column:2}.l{grid-column:1}.s{grid-column:2;background:#dc2626}.r{grid-column:3}.b{grid-column:2}
.clean{width:100%;margin-top:12px;background:#2563eb}.clean.on{background:#16a34a}
.row{margin-top:15px}.row label{display:block;color:#94a3b8;font-size:12px;margin-bottom:7px}
#speed{width:100%}.help{color:#64748b;font-size:11px;line-height:1.6;margin-top:15px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#111827;z-index:10}
#error{display:none;position:absolute;right:20px;top:20px;max-width:420px;padding:15px;background:#7f1d1d;border-radius:10px;z-index:20}
</style>
</head>
<body>
<div id="viewer"></div>
<div id="loading">Loading Solar Robot...</div>
<div id="error"></div>

<div id="ui">
<h1>☀ Solar Robot</h1>
<div class="sub">Tracked Solar Panel Cleaning Robot</div>
<div class="status" id="status">● Ready</div>

<div class="controls">
<button class="f" data-c="forward">▲</button>
<button class="l" data-c="left">◀</button>
<button class="s" data-c="stop">■</button>
<button class="r" data-c="right">▶</button>
<button class="b" data-c="backward">▼</button>
</div>

<button id="clean" class="clean">Start Cleaning</button>

<div class="row">
<label>Speed: <span id="sv">50%</span></label>
<input id="speed" type="range" min="10" max="100" value="50">
</div>

<div class="help">
<b>W/A/S/D</b> tank movement · <b>C</b> cleaning · <b>Space</b> stop<br>
Mouse drag = rotate · Wheel = zoom
</div>
</div>

</script>

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x111827);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,10000);
camera.position.set(4.5,3.5,5.5);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("viewer").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.target.set(0,.5,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x334155,2.2));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(5,10,5);
sun.castShadow=true;
scene.add(sun);

/* -----------------------------------------------------------
   SOLAR PANEL ARRAY
   ----------------------------------------------------------- */

const surfaceGroup=new THREE.Group();
surfaceGroup.rotation.x=THREE.MathUtils.degToRad(-8);
scene.add(surfaceGroup);

const PANEL_W=8;
const PANEL_L=2.5;
const PANEL_GAP=.06;
const PANEL_COUNT=12;

const panelMaterial=new THREE.MeshStandardMaterial({
 color:0x172554,
 roughness:.42,
 metalness:.25
});

for(let i=0;i<PANEL_COUNT;i++){
 const p=new THREE.Mesh(
  new THREE.BoxGeometry(PANEL_W,.045,PANEL_L),
  panelMaterial
 );
 p.position.set(0,0,i*(PANEL_L+PANEL_GAP));
 surfaceGroup.add(p);

 const g=new THREE.GridHelper(PANEL_W,16,0x64748b,0x334155);
 g.scale.z=PANEL_L/PANEL_W;
 g.position.set(0,.026,i*(PANEL_L+PANEL_GAP));
 surfaceGroup.add(g);
}

surfaceGroup.position.z=-(PANEL_COUNT-1)*(PANEL_L+PANEL_GAP)/2;

/* -----------------------------------------------------------
   ROBOT STATE
   ----------------------------------------------------------- */

const state={
 robot:null,
 trackL:null,
 trackR:null,
 brushL:null,
 brushR:null,
 moving:false,
 cleaning:false,
 direction:"stop",
 speed:.5,
 restTrackL:null,
 restTrackR:null,
 restBrushL:null,
 restBrushR:null,
 treadL:null,
 treadR:null
};

/* -----------------------------------------------------------
   REALISTIC TANK TREAD VISUALIZATION
   -----------------------------------------------------------

   The Blender track objects are the fixed belt bodies.
   They are NEVER rotated as a whole.

   Individual tread plates are animated around a closed rounded
   rectangle, exactly like links travelling around a tank track.
   ----------------------------------------------------------- */

function makeTreadSystem(trackBone, side){
 if(!trackBone) return null;

 const group=new THREE.Group();
 group.name=side+"_Animated_Tread_Links";

 // Attach the tread system to the same robot hierarchy as the track.
 // Its local coordinates are therefore locked to the robot.
 state.robot.add(group);

 // The robot is normalized after loading, so use a visual scale
 // proportional to the robot's overall size.
 const trackLength=1.72;
 const trackHeight=.48;
 const trackWidth=.055;

 // Position is taken from the actual Blender track bone.
 const worldPos=new THREE.Vector3();
 trackBone.getWorldPosition(worldPos);
 state.robot.worldToLocal(worldPos);
 group.position.copy(worldPos);

 // Match the bone's orientation without inheriting its animation.
 const worldQuat=new THREE.Quaternion();
 trackBone.getWorldQuaternion(worldQuat);
 state.robot.worldToLocal(new THREE.Vector3());
 group.quaternion.copy(state.robot.quaternion).invert().multiply(worldQuat);

 const treadMaterial=new THREE.MeshStandardMaterial({
   color:0x242424,
   roughness:.85,
   metalness:.05
 });

 const linkCount=22;
 const radiusX=trackLength/2-.12;
 const radiusY=trackHeight/2-.08;

 for(let i=0;i<linkCount;i++){
   const link=new THREE.Mesh(
     new THREE.BoxGeometry(.14,trackWidth,.055),
     treadMaterial
   );
   link.castShadow=true;
   link.receiveShadow=true;
   link.userData.treadIndex=i;
   group.add(link);
 }

 return {
   group,
   links:group.children,
   radiusX,
   radiusY,
   length:trackLength,
   height:trackHeight,
   phase:0,
   direction:side==="L"?1:-1
 };
}

function updateTreadSystem(sys, travel, dt){
 if(!sys) return;

 // Travel is signed. One revolution of the closed loop corresponds
 // to physical belt travel around the track perimeter.
 sys.phase += travel * dt * sys.direction * 3.8;

 const count=sys.links.length;
 const perimeter =
   2*Math.PI*Math.min(sys.radiusY,sys.radiusX) +
   2*(sys.radiusX-sys.radiusY)*2;

 for(let i=0;i<count;i++){
   const u=((i/count)+(sys.phase/perimeter))%1;
   const d=u<0?u+1:u;
   const p=d*perimeter;

   let x,z;

   const straight=2*(sys.radiusX-sys.radiusY);
   const arc=Math.PI*sys.radiusY;
   const section=2*straight+2*arc;

   let q=p;

   if(q<straight){
     x=-sys.radiusX+sys.radiusY+q;
     z=sys.radiusY;
   }else if((q-=straight)<arc){
     const a=q/sys.radiusY;
     x=(sys.radiusX-sys.radiusY)+Math.sin(a)*sys.radiusY;
     z=Math.cos(a)*sys.radiusY;
   }else if((q-=arc)<straight){
     x=sys.radiusX-sys.radiusY-q;
     z=-sys.radiusY;
   }else{
     q-=straight;
     const a=q/sys.radiusY;
     x=-(sys.radiusX-sys.radiusY)+Math.sin(a)*sys.radiusY;
     z=-Math.cos(a)*sys.radiusY;
   }

   const link=sys.links[i];
   link.position.set(x,0,z);

   // Tangent direction so every plate follows the loop.
   const eps=.002;
   let p2=(p+eps)%perimeter;
   let q2=p2;
   let x2,z2;

   if(q2<straight){
     x2=-sys.radiusX+sys.radiusY+q2; z2=sys.radiusY;
   }else if((q2-=straight)<arc){
     const a=q2/sys.radiusY;
     x2=(sys.radiusX-sys.radiusY)+Math.sin(a)*sys.radiusY;
     z2=Math.cos(a)*sys.radiusY;
   }else if((q2-=arc)<straight){
     x2=sys.radiusX-sys.radiusY-q2; z2=-sys.radiusY;
   }else{
     q2-=straight;
     const a=q2/sys.radiusY;
     x2=-(sys.radiusX-sys.radiusY)+Math.sin(a)*sys.radiusY;
     z2=-Math.cos(a)*sys.radiusY;
   }

   link.rotation.y=Math.atan2(z2-z,x2-x);
 }
}

/* -----------------------------------------------------------
   MODEL LOADING
   ----------------------------------------------------------- */

function fail(message){
 const e=document.getElementById("error");
 e.textContent=message;
 e.style.display="block";
 console.error(message);
}

try{
 const binary=atob(MODEL);
 const bytes=new Uint8Array(binary.length);
 for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);

 new GLTFLoader().parse(bytes.buffer,"",gltf=>{
  state.robot=gltf.scene;
  surfaceGroup.add(state.robot);

  state.robot.traverse(o=>{
   if(!o.isBone)return;

   if(o.name==="track_L")state.trackL=o;
   if(o.name==="track_R")state.trackR=o;
   if(o.name==="brush_L")state.brushL=o;
   if(o.name==="brush_R")state.brushR=o;
  });

  // Preserve the Blender-exported bind/rest rotations.
  // All animation below is applied as a delta on top of these poses.
  state.restTrackL=state.trackL?state.trackL.quaternion.clone():null;
  state.restTrackR=state.trackR?state.trackR.quaternion.clone():null;
  state.restBrushL=state.brushL?state.brushL.quaternion.clone():null;
  state.restBrushR=state.brushR?state.brushR.quaternion.clone():null;
  // Hide only the moving whole-track geometry visually; keep the Blender
  // track rig/bone fixed and use the individual tread links below.
  state.treadL=makeTreadSystem(state.trackL,"L");
  state.treadR=makeTreadSystem(state.trackR,"R");

  /* Normalize model size while preserving the rig. */
  const box=new THREE.Box3().setFromObject(state.robot);
  const size=new THREE.Vector3();
  box.getSize(size);

  const largest=Math.max(size.x,size.y,size.z);
  if(largest>0)state.robot.scale.setScalar(2.8/largest);

  /* Put model centered on the panel surface. */
  const b=new THREE.Box3().setFromObject(state.robot);
  const c=new THREE.Vector3();
  b.getCenter(c);

  state.robot.position.x-=c.x;
  state.robot.position.z-=c.z;
  state.robot.position.y-=b.min.y;
  state.robot.position.y+=.04;

  document.getElementById("loading").style.display="none";

  console.log("Rig bones:",{
   track_L:state.trackL,
   track_R:state.trackR,
   brush_L:state.brushL,
   brush_R:state.brushR
  });
 },e=>fail("Could not load Blender model: "+e));
}catch(e){
 fail("Could not decode Blender model: "+e.message);
}

/* -----------------------------------------------------------
   COMMANDS
   ----------------------------------------------------------- */

function setStatus(text){
 document.getElementById("status").textContent="● "+text;
}

function command(c){
 if(c==="stop"){
  state.moving=false;
  state.direction="stop";
  setStatus(state.cleaning?"Cleaning":"Stopped");
  return;
 }

 state.moving=true;
 state.direction=c;

 if(c==="forward")setStatus("Moving Forward");
 if(c==="backward")setStatus("Moving Backward");
 if(c==="left")setStatus("Turning Left");
 if(c==="right")setStatus("Turning Right");

 console.log("COMMAND:",c);
}

document.querySelectorAll("[data-c]").forEach(button=>{
 button.addEventListener("mousedown",()=>command(button.dataset.c));
 button.addEventListener("touchstart",e=>{
  e.preventDefault();
  command(button.dataset.c);
 },{passive:false});
});

const clean=document.getElementById("clean");

clean.addEventListener("click",()=>{
 state.cleaning=!state.cleaning;
 clean.classList.toggle("on",state.cleaning);
 clean.textContent=state.cleaning?"Stop Cleaning":"Start Cleaning";
 setStatus(state.cleaning?"Cleaning":"Ready");
 console.log("COMMAND:",state.cleaning?"cleaning_on":"cleaning_off");
});

const speed=document.getElementById("speed");
const sv=document.getElementById("sv");

speed.addEventListener("input",()=>{
 state.speed=Number(speed.value)/100;
 sv.textContent=speed.value+"%";
});

/* -----------------------------------------------------------
   KEYBOARD
   ----------------------------------------------------------- */

const keys=new Set();

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();

 if(k===" "){
  e.preventDefault();
  command("stop");
  return;
 }

 if(keys.has(k))return;
 keys.add(k);

 if(k==="w")command("forward");
 if(k==="s")command("backward");
 if(k==="a")command("left");
 if(k==="d")command("right");
 if(k==="c")clean.click();
});

window.addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 keys.delete(k);

 if("wasd".includes(k)){
  command("stop");
 }
});

/* -----------------------------------------------------------
   TANK-STYLE DIFFERENTIAL TRACK SIMULATION
   -----------------------------------------------------------

   IMPORTANT:
   The track meshes/bones are NOT used to turn the robot.

   Instead:
   - left/right track velocities determine the robot's motion
   - the robot body rotates around Y
   - each track rolls independently around its Z axis

   This prevents the common problem where the visual track rotation
   makes the robot appear to rotate incorrectly.
   ----------------------------------------------------------- */

const clock=new THREE.Clock();
let brushAngleL=0;
let brushAngleR=0;

const tmpQ=new THREE.Quaternion();
const AXIS_TRACK_X=new THREE.Vector3(1,0,0);
const AXIS_BRUSH_Y=new THREE.Vector3(0,1,0);

function applyBoneLocalAxis(bone,rest,axis,angle){
 if(!bone||!rest)return;

 // IMPORTANT:
 // Multiply on the RIGHT so the rotation is in the bone's LOCAL
 // coordinate system. For the tracks, local Z is across the tread
 // width, exactly like the axle of a real tank track.
 tmpQ.setFromAxisAngle(axis,angle);
 bone.quaternion.copy(rest).multiply(tmpQ);
 bone.updateMatrixWorld(true);
}

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);

 if(state.robot){

  /*
   * THE BLENDER MODEL'S REAL AXES:
   * X = robot length / forward-backward
   * Z = robot width / left-right
   * Y = vertical / panel normal
   *
   * Therefore the tank drives along X and yaws around Y.
   */

  const maxTrackSpeed=.95*state.speed;
  let left=0;
  let right=0;

  if(state.moving){
   if(state.direction==="forward"){
    left=maxTrackSpeed;
    right=maxTrackSpeed;
   }else if(state.direction==="backward"){
    left=-maxTrackSpeed;
    right=-maxTrackSpeed;
   }else if(state.direction==="left"){
    left=-maxTrackSpeed;
    right=maxTrackSpeed;
   }else if(state.direction==="right"){
    left=maxTrackSpeed;
    right=-maxTrackSpeed;
   }
  }

  // Tank differential-drive equations.
  const trackSeparation=1.65;
  const linear=(left+right)/2;
  const yaw=(right-left)/trackSeparation;

  // Forward direction of this Blender robot is -X.
  if(Math.abs(linear)>0.00001){
   state.robot.translateX(-linear*dt);
  }

  // Turn like a tank: body rotates about its vertical Y axis.
  if(Math.abs(yaw)>0.00001){
   state.robot.rotation.y+=yaw*dt;
  }

  /*
   * CRAWLER TRACKS — TANK STYLE
   *
   * The fixed Blender track body does NOT rotate.
   * Instead, individual tread plates travel around its closed loop.
   */
  updateTreadSystem(state.treadL,left,dt);
  updateTreadSystem(state.treadR,right,dt);

  /*
   * SPONGE BRUSHES
   *
   * Blender's sponge discs are cylinders with their axis along Y.
   * The panel surface is X-Z, therefore the sponge must rotate
   * around Y, perpendicular to the panel surface.
   *
   * Opposite directions make the two discs scrub the panel.
   */
  if(state.cleaning){
   const brushRoll=8.0*state.speed*dt;
   brushAngleL+=brushRoll;
   brushAngleR-=brushRoll;

   applyBoneLocalAxis(
    state.brushL,state.restBrushL,
    AXIS_BRUSH_Y,brushAngleL
   );

   applyBoneLocalAxis(
    state.brushR,state.restBrushR,
    AXIS_BRUSH_Y,brushAngleR
   );
  }else{
   // Keep brushes exactly in their Blender rest pose when cleaning is off.
   applyBoneLocalAxis(
    state.brushL,state.restBrushL,
    AXIS_BRUSH_Y,brushAngleL
   );
   applyBoneLocalAxis(
    state.brushR,state.restBrushR,
    AXIS_BRUSH_Y,brushAngleR
   );
  }

  // Keep the robot physically above the inclined panel surface.
  // The robot is a child of surfaceGroup, so it automatically follows
  // the 8-degree panel inclination.
 }

 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
